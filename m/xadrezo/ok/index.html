<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oranjbosk Kelkfoa</title>
    <link href="./style.css" rel="stylesheet" type="text/css" media="all">
	<script src="./coi-serviceworker.min.js"></script>
  </head>
  <body>
	<div class="masthead">
		<a href="javascript:void(0)" onclick="location.hash = ''; loadArticle()"><img class="logo" src="./oranjbosk-kelkfoa.svg"></a>
		<div style="display: flex; margin-left: 8px; flex-direction: column; flex-grow: 1">
			<div style="color: white; flex-grow: 1; font-weight: bold" id="date"></div>
			<div style="color: white;"><a style="color: white" href="javascript:void(0);" onclick="location.hash = '#novaji'; loadArticle()">Novaji</a> · <a style="color: white" href="javascript:void(0);" onclick="location.hash = '#ludi'; loadArticle()">Ludi</a> · <a style="color: white" href="javascript:void(0);" onclick="switchLang('en.html');">ENGLISH</a></div>
			<div style="color: white;"><a style="color: white" href="javascript:void(0);" onclick="location.hash = '#kontakt'; loadArticle()">Kontakt</a></div>
		</div>
		<img class="ad" id="ad">
	</div>
	
	<div class="main">
		<div class="sidebar">
			<b>Leplu novi</b><br>
			<text id="articleList1"><i>Sharjant linki...</i></text>
			<text id="articleList2"></text>
			<text id="articleList3"></text>
			<hr>
			<b>Ekonomia</b><br>
			<text id="ecoList1"><i>Sharjant...</i><br></text>
			<hr>
			<b>Sport</b><br>
			<text id="sportList1"><i>Sharjant linki...</i></text>
			<text id="sportList2"></text>
			<text id="sportList3"></text>
			<a href="javascript:void(0);" onclick="location.hash = '#sport'; loadArticle()">(plu...)</a>
			<hr>
		</div>
		<div id="article">
			<i>Sharjant artikl...</i>
		</div>
	</div>
	
	<img style="display: block; margin: auto; margin-top: 16px; padding-bottom: 16px" class="ad" id="ad1">
  </body>
  <script src="ads.js"></script>
  <script>
	var language = "ob"
	
	function switchLang(lang) {
		window.location.href = "./" + lang + location.hash;
	}
	
	function parseDateFormat(string) {
		var year = parseInt(string.slice(0,4))
		var month = parseInt(string.slice(4,6))
		var day = parseInt(string.slice(6,8))
		
		var monthNames = ["yanuar", "februar", "mars", "april", "mai", "yuni", "yuli", "august", "septembr", "oktobr", "novembr", "desembr"]
		
		return day + "im " + monthNames[month - 1] + " " + year
	}
	
	function loadArticle() {
		loadAds()
		
		var hash = (location.hash.slice(1,7) == "sport-" ? "sport-" : location.hash.slice(1))
		var articleField = document.querySelector("#article")
		
		switch (hash) {
			case "":
				document.title = "Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Velkom!</h2><p>Velkom a <b>Oranjbosk Kelkfoa</b>, prim (e sol) gaset pro Oranjbosk e omni de Hellcraft. Klika su linki in flankbar a aperiar artikli.</p><p>Oranjbosk Kelkfoa es entrepren nedependant per: <br><i>xadrezo, 384/266 Oranjbosk</i>.</p><p>If vo desir publikar artikl siloke, kontakta noi if it plis. Submitasioni esero posible traduked u redakted, a konformar plu bene ko nostr gidlinii.</p>"
				break
			case "kontakt":
				document.title = "Kontakt · Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Kontakt</h2><h4>In Hellcraft</h4><p>xadrezo<br>384/266 Oranjbosk</p><h4>Eksteriore</h4><img src='https://xadrezo.neocities.org/impressum.png'/>"
				break
			case "ludi":
				document.title = "Ludi · Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Ludi</h2><p>· <a href=\"javascript:void(0);\" onclick=\"location.hash = '#sudoku'; loadArticle()\">Sudoku</a></p><p>· <a href=\"javascript:void(0);\" onclick=\"location.hash = '#domet'; loadArticle()\">Domet</a></p>"
				break
			case "sudoku":
				document.title = "Sudoku · Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Sudoku</h2><h4 id='sudokuheader'></h4>" //<IFRAME id='sudokufield' SRC='./sudoku/sudoku.html#ob'  SCROLLING='no' WIDTH='400' HEIGHT='400' FRAMEBORDER='0'></IFRAME>" //WIDTH='240' HEIGHT='260'
				//document.querySelector("#sudokuheader").innerHTML = document.querySelector("#sudokufield").contentWindow.seedVar
				
				var iframe = document.createElement('iframe')
				iframe.onload = function() {document.querySelector("#sudokuheader").innerHTML = "Enigmat diurnik pro " + parseDateFormat(iframe.contentWindow.seedVar)}
				iframe.src = './sudoku/sudoku.html#ob'
				iframe.scrolling = 'no'
				iframe.width = '400'
				iframe.height = '350'
				iframe.frameBorder = '0'
				
				articleField.appendChild(iframe)
				break
			case "domet":
				document.title = "Domet · Orangewood Occasional"; 
				articleField.innerHTML = "<h2>Domet</h2>" //<IFRAME id='sudokufield' SRC='./sudoku/sudoku.html#ob'  SCROLLING='no' WIDTH='400' HEIGHT='400' FRAMEBORDER='0'></IFRAME>" //WIDTH='240' HEIGHT='260'
				//document.querySelector("#sudokuheader").innerHTML = document.querySelector("#sudokufield").contentWindow.seedVar
				
				var iframe = document.createElement('iframe')
				//iframe.onload = function() {document.querySelector("#sudokuheader").innerHTML = "Daily puzzle for " + parseDateFormat(iframe.contentWindow.seedVar)}
				iframe.src = './tinyhouse/tinyhouse.html#ob'
				iframe.scrolling = 'no'
				iframe.width = '450'
				iframe.height = '350'
				iframe.frameBorder = '0'
				iframe.credentialless = true
				
				articleField.appendChild(iframe)
				break
			case "novaji":
				document.title = "Arkiv de novaji · Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Arkiv de novaji</h2><p>Artikli es adported e sharjed dinamikale. Ergo list base poteserio esar nekomplet.</p><p><i>Sharjant artikli...</i></p>";
				
				(async() => {
					console.log("waiting for variable");
					while(articleList === undefined)
						await new Promise(resolve => setTimeout(resolve, 1000));
					console.log("variable is defined");
					
					var archiveList = articleList
					
					var output = ""
					for (let i = 0; i < archiveList.length; i++) {
					  output += "<p>" + '· <a href="javascript:void(0)" onclick="location.hash = \'#' + archiveList[i].name.slice(0, -5) + '\'; loadArticle()">' + await getTitle(archiveList[i].path) + '</a>' + " (" + parseDateFormat(archiveList[i].name) + ")" + "<br>" + "</p>"
				}
				
				articleField.innerHTML = "<h2>Arkiv de novaji</h2><p>Artikli es adported e sharjed dinamikale. Ergo list base poteserio esar nekomplet.</p>" + output
				})();
				
				break
			case "sport":
				document.title = "Arkiv de sport · Oranjbosk Kelkfoa"; 
				articleField.innerHTML = "<h2>Arkiv de sport</h2><p>Artikli es adported e sharjed dinamikale. Ergo list base poteserio esar nekomplet.</p><p><i>Sharjant artikli...</i></p>";
				
				(async() => {
					console.log("waiting for variable");
					while(sportList === undefined)
						await new Promise(resolve => setTimeout(resolve, 1000));
					console.log("variable is defined");
					
					var archiveList = sportList
					
					var output = ""
					for (let i = 0; i < Math.max(1, archiveList.length); i++) {
					  output += "<p>" + setSportsArticleLink(archiveList, i, 1) + "</p>"
				}
				
				articleField.innerHTML = "<h2>Arkiv de sport</h2><p>Artikli es adported e sharjed dinamikale. Ergo list base poteserio esar nekomplet.</p>" + output
				})();
				
				break
			case "sport-":
				var loadFile
				
				fetch("https://balls.skin/m/xadrezo/ok/sport/" + location.hash.slice(7) + ".json")
				.then(res => res.json())
				.then(json => loadFile = json)
				.then(() => {document.title = loadFile[language]["title"] +  " · Oranjbosk Kelkfoa"; articleField.innerHTML = "<h2>" + loadFile[language]["title"] + "</h2><h4>" + loadFile["author"] + ", " + parseDateFormat(hash.slice(0,-3)) + "</h4><p>" + loadFile[language]["content"] + "</p>"})
			default:
				var loadFile
				
				fetch("https://balls.skin/m/xadrezo/ok/artikli/" + hash + ".json")
				.then(res => res.json())
				.then(json => loadFile = json)
				.then(() => {document.title = loadFile[language]["title"] +  " · Oranjbosk Kelkfoa"; articleField.innerHTML = "<h2>" + loadFile[language]["title"] + "</h2><h4>" + loadFile["author"] + ", " + parseDateFormat(hash.slice(0,-3)) + "</h4><p>" + loadFile[language]["content"] + "</p>"})
		}
	}
	
	function clockUpdate() {
		var clockLoc = document.querySelector("#date")
		
		var time = new Date(new Date().getTime() + (0 * 24 * 60 * 60 * 1000) - (0 * 60 * 60 * 1000))
		
		var weekdayString = {"Mon": "lundi", "Tue": "marsdi", "Wed": "merkurdi", "Thu": "yovdi", "Fri": "vendrdi", "Sat": "saturndi", "Sun": "soldi"}[time.toLocaleString("en-GB", { timeZone: "US/Central", weekday: "short"})]
		var dateString = time.toLocaleString("en-GB", { timeZone: "US/Central", day: "numeric"}) + "im";
		var monthString = ["yanuar", "februar", "mars", "april", "mai", "yuni", "yuli", "august", "septembr", "oktobr", "novembr", "desembr"][time.toLocaleString("en-GB", { timeZone: "US/Central", month: "numeric"}) - 1];
		var yearString = time.toLocaleString("en-GB", { timeZone: "US/Central", year: "numeric"});

		var timeString = time.toLocaleString("en-GB", { timeZone: "US/Central", timeStyle: "short"}).toUpperCase();
		
		clockLoc.innerHTML = weekdayString + ", " + dateString + " " + monthString + " " + yearString + ", " + timeString + " HST"
	}
	
	clockUpdate()
	setInterval(clockUpdate, 250);
	
	loadArticle()
	
	async function getTitle(url) {  
		  return fetch(`https://balls.skin/${url}`)
			.then((response) => response.json())
			.then((json) => {
			  return json[language]["title"];
			});
		};
	
	async function setArticleLink(list, index) {
		try {
			res = '· <a href="javascript:void(0)" onclick="location.hash = \'#' + list[index].name.slice(0, -5) + '\'; loadArticle()">' + await getTitle(list[index].path) + '</a>' + "<br>"
		} catch (error) {
			console.error(error);
			res = ""
		}
		
		return res
	}
	
	function setSportsArticleLink(list, index, longForm) {
		var sportTypes = {	"chess": [" ♔", " (shak)"],
							"shogi": [" 🦁", " (shogi)"],
							"football": [" 🏈", " (futbol)"]
		}
		
		try {
			res = '· ' + list[index]["player1"][longForm] + ' <a href="' + (list[index]["externalLink"] ? list[index]["externalLink"] : 'javascript:void(0)" onclick="location.hash = \'#' + list[index]["link"] + '\'; loadArticle()') + '">' + list[index]["player1score"] + ':' + list[index]["player2score"] + '</a> ' + list[index]["player2"][longForm] + sportTypes[list[index]["sport"]][longForm] + (longForm ? ' (' + parseDateFormat(list[index]["date"]) + ')' : "") + '</a>' + "<br>"
		} catch (error) {
			console.error(error);
			res = (index == 0 ? "<i>nokos nov</i><br>" : "")
		}
		
		return res
	}
	
	var articleList
	var sidebarArticleList
	
	fetch("https://api.github.com/repositories/761978945/contents/m/xadrezo/ok/artikli")
	.then(res => res.json())
	.then(json => articleList = json)
	.then(() => sidebarArticleList = structuredClone(articleList))
	.then(() => sidebarArticleList.reverse())
	.then(() => setArticleLink(sidebarArticleList, 0)
		.then(res => document.querySelector("#articleList1").innerHTML = res))
	.then(() => setArticleLink(sidebarArticleList, 1)
		.then(res => document.querySelector("#articleList2").innerHTML = res))
	.then(() => setArticleLink(sidebarArticleList, 2)
		.then(res => document.querySelector("#articleList3").innerHTML = res))
	
	var exchangeRate

	fetch('https://www.floatrates.com/daily/eur.json')
		.then(res => res.json())
		.then(out => exchangeRate = Object.assign({}, exchangeRate, out))
		.then(() => document.querySelector("#ecoList1").innerHTML = "US$1 = €" + parseFloat(exchangeRate["usd"]["inverseRate"]).toFixed(3) + "<br>€1 = US$" + parseFloat(exchangeRate["usd"]["rate"]).toFixed(3))
	
	var sportList
	var sidebarSportList
	
	fetch("https://balls.skin/m/xadrezo/ok/sport.json")
	.then(res => res.json())
	.then(json => sportList = json)
	.then(() => sidebarSportList = structuredClone(sportList))
	.then(() => sidebarSportList.reverse())
	.then(() => document.querySelector("#sportList1").innerHTML = setSportsArticleLink(sidebarSportList, 0, 0))
	.then(() => document.querySelector("#sportList2").innerHTML = setSportsArticleLink(sidebarSportList, 1, 0))
	.then(() => document.querySelector("#sportList3").innerHTML = setSportsArticleLink(sidebarSportList, 2, 0))
	
  </script>
</html>

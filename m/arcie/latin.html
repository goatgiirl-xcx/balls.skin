<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Latin to English pronunciation</title>
        <link href="css.css" rel="stylesheet" type="text/css" media="all">
        <link href="" rel="stylesheet" type="text/css" media="screen" id="font-link">
        <link href="" rel="stylesheet" type="text/css" media="screen" id="theme-link">
    </head>
    <body>
        <div class = "main">
            <h1>Latin to English pronunciation tool</h1>
            <p>This tool converts Latin words to their <a href="https://en.wikipedia.org/wiki/Traditional_English_pronunciation_of_Latin">traditional English pronunciation</a>. <strong>Be sure to include macrons when inputting the Latin text.</strong></p>
            <form id="form">
                <label for="latin">Insert Latin here:</label>
                <input type="text" onkeyup="latinPronouncer()" id="latin" name="latin">
            </form>
            <p id="ipaoutput"></p>
            <p id="respelloutput"></p>
        </div>
   		<script src="latin.js"></script>
        <script src="/js.js"></script>
        <script>loadLanguage()</script>
    </body>
</html>

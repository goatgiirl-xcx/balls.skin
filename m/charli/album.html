<!DOCTYPE html>

<style>
* {
	image-rendering: pixelated;
	margin: 0;
	padding: 0;
}

:root {
	--album: 256px;
	--album-grid: calc(var(--album)/1.75);
}

body {
	height: 100vh;
	width: 100vw;
	background-color: black;
	color: white;
	font-family: monospace, sans-serif;
	display: flex;
	flex-direction: row;
	overflow: hidden;
}

#gallery {
	display: grid;
	grid-template-columns: repeat(auto-fit, var(--album-grid));
	grid-template-rows: repeat(auto-fit, var(--album-grid));
	width: calc(100vw - (var(--album) + 2em) - mod(100vw - (var(--album) + 2em), var(--album-grid)));
	height: 100vh;
	overflow-y: auto;
}

#display {
	padding: 1em;
	text-align: center;
	width: calc(var(--album) + mod(100vw - (var(--album) + 2em), var(--album-grid)));
	flex-grow: 1;
}

#gallery img {
	width: var(--album-grid);
	height: var(--album-grid);
}

#display img {
	width: var(--album);
	height: var(--album);
}

a {
	color: inherit;
}

#display-artist, #display-album {
	font-size: 200%;
}

a[href=""] {
  display: none;
}
</style>

<body>
<section id="gallery">
</section>

<section id="display">
	<img id="display-image" src="">
	<p id="display-artist">Artist</p>
	<p id="display-album">Album</p>
	<p id="display-year">Year</p>
	<p id="display-genre">Genre</p>
	<br>
	<p>Recommended: <span id="display-rec"></span></p>
	<br>
	<p><a id="display-lastfm" href="">LastFM</a></p>
	<p><a id="display-youtube" href="">YouTube</a></p>
	<p><a id="display-spotify" href="">Spotify</a></p>
	<p><a id="display-bandcamp" href="">Bandcamp</a></p>
</section>

</body>

function shuffleArray(array) {
  for (var i = array.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = array[i];
      array[i] = array[j];
      array[j] = temp;
  }
  return array
}

shuffleArray(music).forEach((album) => {
	img = document.createElement("img");
	img.src = album.art;
	img.alt = album.artist + " - " + album.album;
	img.setAttribute("data-artist", album.artist);
	img.setAttribute("data-album", album.album);
	img.setAttribute("data-year", album.year);
	img.setAttribute("data-genre", album.genre);
	img.setAttribute("data-rec", album.rec);
	img.setAttribute("data-lastfm", album.lastfm);
	img.setAttribute("data-youtube", album.youtube);
	img.setAttribute("data-spotify", album.spotify);
	img.setAttribute("data-bandcamp", album.bandcamp);
	document.getElementById("gallery").appendChild(img);
});

document.querySelectorAll("#gallery img").forEach((cover) => {
	cover.addEventListener("click", () => {
		document.getElementById("display-image").src = cover.src;
		document.getElementById("display-artist").textContent = cover.getAttribute("data-artist");

		document.getElementById("display-image").alt = cover.getAttribute("data-album");
		document.getElementById("display-year").textContent = cover.getAttribute("data-year");
